<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fancify Shamcify</title>

    <!-- Link to the JavaScript that drives all the behavior -->
    <script src="fancifymytext.js" defer></script>
  </head>

  <body>
    <h1>Fancify my Text</h1>

    <!-- Text input area -->
    <fieldset>
      <legend>Text</legend>
      <textarea id="text-area" rows="4" cols="30"></textarea>
    </fieldset>

    <!-- Styling controls -->
    <fieldset>
      <legend>Fancify</legend>

      <!-- Bigger! -->
      <button id="bigger-button" onclick="makeBigger()">Bigger!</button>
      <br><br>

      <!-- Radio buttons -->
      <input type="radio" id="fancy-radio" name="mode" onchange="changeStyle()">
      <label for="fancy-radio">FancyShmancy</label><br>

      <input type="radio" id="boring-radio" name="mode" onchange="changeStyle()" checked>
      <label for="boring-radio">BoringBetty</label><br><br>

      <!-- Moo -->
      <button id="moo-button" onclick="makeMoo()">Moo</button>
    </fieldset>
  </body>
</html>
